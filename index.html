<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink | 写真で交換日記</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#f4c95d"/>
        <circle cx="14" cy="18" r="2.4" fill="#2a2550"/>
        <circle cx="26" cy="18" r="2.4" fill="#2a2550"/>
        <path d="M14 25 Q20 29 26 25" stroke="#2a2550" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Woolink</span>
      <span class="page-name">交換日記</span>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" href="placeholder.html?title=プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <div class="scroll-area">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        戻る
      </button>

      <h1 class="page-title">写真で交換日記</h1>
      <p class="page-subtitle">写真からショート風動画を作ります</p>

      <label class="file-select" id="fileSelectLabel" for="photoInput">
        <span id="fileSelectText">ファイルを選択（最大10枚・複数選択可）</span>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
      </label>

      <div class="thumb-strip hidden" id="thumbStrip"></div>

      <button class="generate-btn" id="generateBtn" disabled>動画を生成する！</button>

      <div class="result-area hidden" id="resultArea">
        <div class="video-frame">
          <div class="frame-grid" id="frameGrid"></div>
          <span class="play-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="#fff"/></svg>
          </span>
        </div>
        <p class="result-caption" id="resultCaption">動画が完成しました！</p>
        <a class="next-btn" href="placeholder.html?title=確認">確認</a>
      </div>
    </div>
  </main>

</div>

<script>
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    }
  });

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    menuPanel.hidden = isOpen;
    menuBtn.classList.toggle('open', !isOpen);
    menuBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- 写真の選択（複数・最大10枚・一括アップロード対応） ---------- */
  const MAX_PHOTOS = 10;
  const photoInput = document.getElementById('photoInput');
  const fileSelectText = document.getElementById('fileSelectText');
  const fileSelectLabel = document.getElementById('fileSelectLabel');
  const thumbStrip = document.getElementById('thumbStrip');
  const generateBtn = document.getElementById('generateBtn');
  const resultArea = document.getElementById('resultArea');
  const frameGrid = document.getElementById('frameGrid');
  const resultCaption = document.getElementById('resultCaption');

  let selectedDataUrls = [];

  function readFilesAsDataUrls(files) {
    return Promise.all(files.map(file => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    })));
  }

  function renderThumbs() {
    thumbStrip.innerHTML = '';
    if (selectedDataUrls.length === 0) {
      thumbStrip.classList.add('hidden');
      return;
    }
    thumbStrip.classList.remove('hidden');
    selectedDataUrls.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'thumb';
      img.alt = '選択した写真';
      thumbStrip.appendChild(img);
    });
  }

  photoInput.addEventListener('change', async () => {
    resultArea.classList.add('hidden');
    generateBtn.textContent = '動画を生成する！';

    const files = Array.from(photoInput.files || []);
    const overLimit = files.length > MAX_PHOTOS;
    const trimmed = files.slice(0, MAX_PHOTOS);

    if (trimmed.length === 0) {
      selectedDataUrls = [];
      fileSelectText.textContent = 'ファイルを選択（最大10枚・複数選択可）';
      fileSelectLabel.classList.remove('has-file');
      generateBtn.disabled = true;
      renderThumbs();
      return;
    }

    selectedDataUrls = await readFilesAsDataUrls(trimmed);
    fileSelectText.textContent = trimmed.length + '枚選択中' + (overLimit ? '（最大10枚までです）' : '');
    fileSelectLabel.classList.add('has-file');
    generateBtn.disabled = false;
    renderThumbs();
  });

  /* ---------- 動画を生成する（選択した写真を使ったデモ演出） ---------- */
  generateBtn.addEventListener('click', () => {
    if (selectedDataUrls.length === 0) return;

    generateBtn.disabled = true;
    generateBtn.textContent = '生成中…';
    resultArea.classList.add('hidden');

    setTimeout(() => {
      frameGrid.innerHTML = '';
      frameGrid.className = 'frame-grid count-' + Math.min(selectedDataUrls.length, 4);
      selectedDataUrls.slice(0, 4).forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '選択した写真';
        frameGrid.appendChild(img);
      });

      resultCaption.textContent = '動画が完成しました！（' + selectedDataUrls.length + '枚の写真から作成）';
      resultArea.classList.remove('hidden');
      generateBtn.textContent = '動画を生成する！';
      generateBtn.disabled = false;
    }, 1500);
  });
</script>

</body>
</html>
