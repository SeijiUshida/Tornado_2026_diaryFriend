<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink | 交換日記</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#f4c95d"/>
        <circle cx="14" cy="18" r="2.4" fill="#2a2550"/>
        <circle cx="26" cy="18" r="2.4" fill="#2a2550"/>
        <path d="M14 25 Q20 29 26 25" stroke="#2a2550" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Woolink</span>
      <span class="page-name">交換日記</span>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" href="placeholder.html?title=プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <div class="scroll-area">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        戻る
      </button>

      <div class="content-preview">
        <p>内容<br>動画か日記の文章</p>
      </div>

      <h1 class="section-title center">誰に送る？</h1>

      <button type="button" class="stranger-btn" id="strangerBtn">初めて出会う誰かに</button>

      <h2 class="section-title">友達に送る</h2>
      <input type="text" class="friend-input" id="friendInput" placeholder="入力">

      <h2 class="section-title">
        <svg class="star-icon" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7.1L12 17.8l-6.2 3.5L7 14.2 2 9.3l7.1-.7z" fill="#f2c94c"/></svg>
        「きいてほしい」した人
      </h2>
      <div class="avatar-row">
        <button type="button" class="avatar-item" data-name="Sora">
          <span class="avatar avatar-a"></span>
          <span class="avatar-name">Sora</span>
        </button>
      </div>

      <h2 class="section-title">最近指定してくれた人</h2>
      <div class="avatar-row">
        <button type="button" class="avatar-item" data-name="Haru">
          <span class="avatar avatar-b"></span>
          <span class="avatar-name">Haru</span>
        </button>
        <button type="button" class="avatar-item" data-name="Yuki">
          <span class="avatar avatar-c"></span>
          <span class="avatar-name">Yuki</span>
        </button>
        <button type="button" class="avatar-item" data-name="Mei">
          <span class="avatar avatar-d"></span>
          <span class="avatar-name">Mei</span>
        </button>
      </div>

      <a class="send-btn" id="sendBtn" href="placeholder.html?title=送信">送信</a>
    </div>
  </main>

</div>

<script>
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    }
  });

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    menuPanel.hidden = isOpen;
    menuBtn.classList.toggle('open', !isOpen);
    menuBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- 送り先の選択（初めて出会う誰か／友達アバター／入力、いずれか1つ） ---------- */
  const strangerBtn = document.getElementById('strangerBtn');
  const friendInput = document.getElementById('friendInput');
  const avatarItems = document.querySelectorAll('.avatar-item');
  const sendBtn = document.getElementById('sendBtn');

  function clearSelection(except) {
    strangerBtn.classList.remove('is-selected');
    avatarItems.forEach(a => a.classList.remove('is-selected'));
    if (except !== 'input') friendInput.value = friendInput.value; // no-op, kept for clarity
  }

  function updateSendState() {
    const hasSelection =
      strangerBtn.classList.contains('is-selected') ||
      [...avatarItems].some(a => a.classList.contains('is-selected')) ||
      friendInput.value.trim().length > 0;
    sendBtn.classList.toggle('is-disabled', !hasSelection);
  }

  strangerBtn.addEventListener('click', () => {
    clearSelection();
    strangerBtn.classList.add('is-selected');
    friendInput.value = '';
    updateSendState();
  });

  avatarItems.forEach(item => {
    item.addEventListener('click', () => {
      clearSelection();
      item.classList.add('is-selected');
      friendInput.value = '';
      updateSendState();
    });
  });

  friendInput.addEventListener('input', () => {
    if (friendInput.value.trim().length > 0) {
      strangerBtn.classList.remove('is-selected');
      avatarItems.forEach(a => a.classList.remove('is-selected'));
    }
    updateSendState();
  });

  sendBtn.addEventListener('click', (e) => {
    if (sendBtn.classList.contains('is-disabled')) {
      e.preventDefault();
    }
  });

  updateSendState();
</script>

</body>
</html>
